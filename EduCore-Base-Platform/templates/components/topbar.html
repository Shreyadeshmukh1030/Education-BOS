<!-- Topbar -->
<header class="bg-white border-b border-neutral-200 h-16 flex-shrink-0 flex items-center justify-between px-4 sm:px-6 lg:px-8 z-10 sticky top-0">
    
    <!-- Left: Hamburger & Search -->
    <div class="flex items-center gap-4 flex-1">
        <!-- Hamburger (Mobile/Sidebar toggle) -->
        <button @click="sidebarOpen = !sidebarOpen" class="text-neutral-500 hover:text-neutral-700 focus:outline-none focus:ring-2 focus:ring-primary rounded-md hidden md:block">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
        </button>
        
        <!-- Global Search -->
        <div class="relative flex-1 max-w-lg hidden sm:block" x-data="{ searchOpen: false }">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-neutral-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                      <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
                    </svg>
                </div>
                <input @focus="searchOpen = true" @click.away="searchOpen = false" type="text" class="block w-full pl-10 pr-3 py-2 border border-neutral-300 rounded-md leading-5 bg-neutral-50 placeholder-neutral-400 focus:outline-none focus:bg-white focus:ring-1 focus:ring-primary focus:border-primary sm:text-sm transition-colors" placeholder="Search students, courses, invoices...">
            </div>
            
            <!-- Search Dropdown Overlay -->
            <div x-show="searchOpen" x-transition class="absolute z-50 mt-1 w-full bg-white rounded-md shadow-lg border border-neutral-200 overflow-hidden" style="display: none;">
                <div class="px-4 py-2 bg-neutral-50 border-b border-neutral-200 text-xs font-semibold text-neutral-500 uppercase tracking-wider">Recent Searches</div>
                <ul class="max-h-80 overflow-y-auto">
                    <!-- Example group -->
                    <li class="px-4 py-2 border-b border-neutral-100 last:border-0 hover:bg-neutral-50 cursor-pointer">
                        <div class="flex items-center gap-3">
                            <div class="bg-primary/10 text-primary p-1.5 rounded">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                            </div>
                            <div>
                                <p class="text-sm font-medium text-neutral-900">Aarav Sharma</p>
                                <p class="text-xs text-neutral-500">Student • B.Tech IT</p>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Right: Actions & Profile -->
    <div class="flex items-center gap-4 ml-4">
        
        <!-- Academic Session Selector -->
        <div class="hidden lg:flex items-center gap-2">
            <span class="text-xs text-neutral-500">Academic Session</span>
            <select class="block w-full pl-3 pr-8 py-1 text-sm border-neutral-300 focus:outline-none focus:ring-primary focus:border-primary rounded-md bg-neutral-50">
                <option>2026 - 2027</option>
                <option>2025 - 2026</option>
            </select>
        </div>

        <!-- Quick Create -->
        <div x-data="{ open: false }" class="relative">
            <button @click="open = !open" @click.away="open = false" class="flex items-center gap-1 bg-primary text-white px-3 py-1.5 rounded-md hover:bg-primary-dark transition-colors shadow-sm text-sm font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                <span class="hidden sm:inline">Quick Create</span>
            </button>
            <div x-show="open" x-transition class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 focus:outline-none" style="display: none;">
                <a href="{% url 'people:student_create' %}" class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-100">Add Student</a>
                <a href="{% url 'academics:program_create' %}" class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-100">Create Program</a>
                <a href="{% url 'finance:invoice_create' %}" class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-100">Create Invoice</a>
                <a href="{% url 'operations:attendance_mark' %}" class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-100">Record Attendance</a>
            </div>
        </div>

        <!-- Notifications -->
        <a href="{% url 'communication:notification_list' %}" class="relative p-1.5 rounded-full text-neutral-500 hover:text-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary bg-neutral-100 hover:bg-primary-50 transition-colors">
            <span class="sr-only">View notifications</span>
            <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-rose-500 ring-2 ring-white"></span>
        </a>

        <!-- Profile Dropdown -->
        <div x-data="{ open: false }" class="relative ml-1">
            <button @click="open = !open" @click.away="open = false" class="flex items-center gap-2 focus:outline-none">
                <div class="h-8 w-8 rounded-full bg-primary/20 flex items-center justify-center border border-primary/30">
                    <span class="text-sm font-medium text-primary">{{ user.first_name|default:user.username|make_list|first|upper }}</span>
                </div>
                <div class="hidden md:flex flex-col text-left">
                    <span class="text-sm font-semibold text-neutral-900 leading-none">{{ user.first_name }} {{ user.last_name }}</span>
                    <span class="text-xs text-neutral-500 leading-none mt-1">{{ user.role.name|default:"User" }}</span>
                </div>
                <svg class="h-4 w-4 text-neutral-400 hidden md:block" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
            <div x-show="open" x-transition class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg py-1 bg-white ring-1 ring-black ring-opacity-5 focus:outline-none" style="display: none;">
                <div class="px-4 py-2 border-b border-neutral-100">
                    <p class="text-sm text-neutral-900 truncate">{{ user.email }}</p>
                </div>
                <a href="{% url 'accounts:profile' %}" class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-100">My Profile</a>
                <a href="{% url 'configuration:index' %}" class="block px-4 py-2 text-sm text-neutral-700 hover:bg-neutral-100">Platform Settings</a>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="block w-full text-left px-4 py-2 text-sm text-danger hover:bg-neutral-100">Logout</button>
                </form>
            </div>
        </div>

    </div>
</header>
