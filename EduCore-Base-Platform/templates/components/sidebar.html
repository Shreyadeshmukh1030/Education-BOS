<aside class="w-64 bg-white border-r border-gray-200 h-full flex flex-col hidden md:flex">
    <div class="flex-1 overflow-y-auto py-4">
        <nav class="space-y-1 px-3">
            <!-- Dashboard (Always enabled) -->
            <a href="{% url 'dashboard' %}" class="{% if request.path == '/' %}bg-indigo-50 text-primary{% else %}text-gray-700 hover:bg-gray-50 hover:text-primary{% endif %} group flex items-center rounded-md px-3 py-2 text-sm font-medium transition-colors">
                <svg class="{% if request.path == '/' %}text-primary{% else %}text-gray-400 group-hover:text-primary{% endif %} flex-shrink-0 -ml-1 mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                </svg>
                <span class="truncate">Dashboard</span>
            </a>
            
            {% if 'accounts' in enabled_modules %}
            <a href="{% url 'accounts:profile' %}" class="text-gray-700 hover:bg-gray-50 hover:text-primary group flex items-center rounded-md px-3 py-2 text-sm font-medium transition-colors">
                <svg class="text-gray-400 group-hover:text-primary flex-shrink-0 -ml-1 mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                </svg>
                <span class="truncate">Your Profile</span>
            </a>
            {% endif %}

            {% for key, module in enabled_modules.items %}
                {% if key != 'accounts' %}
                <a href="{% url module.url %}" class="text-gray-700 hover:bg-gray-50 hover:text-primary group flex items-center rounded-md px-3 py-2 text-sm font-medium transition-colors">
                    <svg class="text-gray-400 group-hover:text-primary flex-shrink-0 -ml-1 mr-3 h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
                    </svg>
                    <span class="truncate">{{ module.name }}</span>
                </a>
                {% endif %}
            {% endfor %}
            
        </nav>
    </div>
    <div class="p-4 border-t border-gray-200">
        <div class="flex items-center gap-3">
            <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-gray-900 truncate">EduCore Base</p>
                <p class="text-xs text-gray-500 truncate">v1.0.0</p>
            </div>
        </div>
    </div>
</aside>
