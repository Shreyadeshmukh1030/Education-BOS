<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EduCore Platform{% endblock %}</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#7c3aed',
                    }
                }
            }
        }
    </script>
    <!-- AlpineJS for interactive components like dropdowns/modals -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full font-sans text-gray-900 antialiased">
    <div class="min-h-full">
        <!-- Main Application Layout (Navbar + Sidebar) -->
        {% if user.is_authenticated %}
            {% include 'components/navbar.html' %}
            
            <div class="flex h-[calc(100vh-4rem)]">
                <!-- Sidebar -->
                {% include 'components/sidebar.html' %}
                
                <!-- Main Content Area -->
                <main class="flex-1 overflow-y-auto bg-gray-50 p-8">
                    {% block content %}{% endblock %}
                </main>
            </div>
        {% else %}
            <!-- Full Page Content (e.g. Login) -->
            <main class="h-screen bg-gray-50 flex items-center justify-center">
                {% block full_content %}{% endblock %}
            </main>
        {% endif %}
    </div>
</body>
</html>
